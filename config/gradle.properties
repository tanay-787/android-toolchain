# Lean Gradle daemon and JVM settings optimized for Firebase Studio / IDX environment (7.8 GB RAM, 2 vCPUs)
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=384m -XX:+UseG1GC -Djava.net.preferIPv4Stack=true
kotlin.daemon.jvmargs=-Xmx1024m -XX:MaxMetaspaceSize=256m
org.gradle.daemon=false
org.gradle.workers.max=2
org.gradle.parallel=false
org.gradle.vfs.watch=false
org.gradle.logging.level=lifecycle
org.gradle.caching=true
org.gradle.java.home=/nix/store/5badkg3gmzg1c29akwglknkizfg6zj0g-openjdk-17.0.17+8

# React Native / Expo lean build props (speeds up builds & saves disk by targeting single ABI)
reactNativeArchitectures=arm64-v8a
