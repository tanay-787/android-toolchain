# Lean JVM & Memory Settings for GitHub Actions Runner (2 vCPU, 7 GB RAM)
org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=512m -XX:+UseG1GC -Djava.net.preferIPv4Stack=true
kotlin.daemon.jvmargs=-Xmx1024m -XX:MaxMetaspaceSize=256m

# CI Concurrency & Lifecycle Settings
org.gradle.daemon=false
org.gradle.workers.max=2
org.gradle.parallel=false
org.gradle.vfs.watch=false
org.gradle.logging.level=lifecycle

# Enable Gradle caching
org.gradle.caching=true

# Single-Architecture Compilation (React Native / Expo / NDK)
reactNativeArchitectures=arm64-v8a
